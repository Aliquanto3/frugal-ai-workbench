# Configuration Streamlit versionnée du démonstrateur.
# Charte générique : tokens de _bmad-output/planning-artifacts/ux-designs/ux-frugal-ai-workbench-2026-09-26/DESIGN.md.
# Chaque clé existe dans Streamlit 1.64.0 (streamlit/config.py).

[client]
# Ni bouton « Deploy » ni menu de développement ; le choix du thème reste dans le menu.
toolbarMode = "viewer"

[server]
# Le serveur n'écoute que sur la machine locale : aucune URL réseau n'est annoncée.
# Pour une démonstration sur le réseau, l'ouvrir explicitement :
#   streamlit run src/app/Accueil.py --server.address 0.0.0.0
address = "localhost"
# Sert src/app/static/ (dossier « static » à côté du script principal) sous app/static/ :
# police Inter et wordmark, sans CDN.
enableStaticServing = true

[browser]
# Pas de télémétrie d'usage envoyée à Streamlit.
gatherUsageStats = false

# Thème commun. Avec [theme.light] et [theme.dark] définis, Streamlit 1.64 crée un thème
# « Custom Theme Auto » qui suit prefers-color-scheme : clair par défaut, sombre si le
# système le demande ; le menu permet de forcer l'un ou l'autre.
[theme]
baseRadius = "12px"
# Inter servie localement, sinon la police du système.
font = "Inter, system-ui, sans-serif"
headingFont = "Inter, system-ui, sans-serif"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/InterVariable.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/InterVariable-Italic.woff2"
weight = "100 900"
style = "italic"

[theme.light]
primaryColor = "#0B6B78"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF1F0"
textColor = "#141A1F"
borderColor = "#C9D1D3"
linkColor = "#0B6B78"
chartCategoricalColors = ["#0B7A86", "#C2560E", "#2F68D0", "#B83A75"]
# Hors tableau Colors de DESIGN.md : texte vert natif (st.success, deltas de st.metric).
# Le défaut de Streamlit (#158237) fait 4,49:1 sur son fond vert (4,03:1 dans la barre
# latérale) ; `succes` de la charte générique, au-dessus de 4,5:1 sur ces fonds.
greenTextColor = "#1D7337"

[theme.dark]
# `primary` sombre de la charte (#4FC1CF) ne porte pas le texte blanc des boutons de Streamlit :
# #0B7A86 (cat-1), blanc dessus 5,07:1, 3,69:1 sur le fond (note primary-dark de DESIGN.md).
primaryColor = "#0B7A86"
backgroundColor = "#0E1316"
secondaryBackgroundColor = "#161D21"
textColor = "#E7ECEE"
borderColor = "#56605F"
linkColor = "#86D8E2"
chartCategoricalColors = ["#4FC1CF", "#F29A57", "#7FA8F5", "#EE7FB2"]
