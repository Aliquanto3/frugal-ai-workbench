# Configuration Streamlit versionnée du démonstrateur.
# Charte générique v2.1 (skills/charte/dist/streamlit-*.toml), sombre d'abord.
# Chaque clé existe dans Streamlit 1.64.0 (streamlit/config.py).

[client]
# Ni bouton « Deploy » ni menu de développement ; le choix du thème reste dans le menu.
toolbarMode = "viewer"

[server]
# Le serveur n'écoute que sur la machine locale : aucune URL réseau n'est annoncée.
# Pour une démonstration sur le réseau, l'ouvrir explicitement :
#   streamlit run src/app/Accueil.py --server.address 0.0.0.0
address = "localhost"
# Sert src/app/static/ (dossier « static » à côté du script principal) sous app/static/ :
# polices de la charte et logotype, sans CDN.
enableStaticServing = true

[browser]
# Pas de télémétrie d'usage envoyée à Streamlit.
gatherUsageStats = false

# Thème commun. Avec [theme.light] et [theme.dark] définis, Streamlit crée un thème « Custom Theme
# Auto » qui suit prefers-color-scheme ; le menu permet de forcer l'un ou l'autre. Règle de la
# charte pour Streamlit : jamais `type="primary"` (Streamlit remplirait le bouton en primaryColor,
# avec un libellé blanc imposé) ; les boutons restent en contour (borderColor = trait-fort).
[theme]
baseRadius = "10px"
font = "'Atkinson Hyperlegible', system-ui, 'Segoe UI', Roboto, sans-serif"
headingFont = "Sora, system-ui, 'Segoe UI', Roboto, sans-serif"
codeFont = "'JetBrains Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible"
url = "app/static/fonts/atkinson-hyperlegible-latin-400-normal.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible"
url = "app/static/fonts/atkinson-hyperlegible-latin-700-normal.woff2"
weight = "700"
style = "normal"

[[theme.fontFaces]]
family = "Sora"
url = "app/static/fonts/sora-latin-600-normal.woff2"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono-latin-400-normal.woff2"
weight = "400"
style = "normal"

[theme.light]
primaryColor = "#1D5BC2"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#ECF0F5"
textColor = "#121821"
linkColor = "#1D5BC2"
borderColor = "#808A97"
chartCategoricalColors = ["#1D5BC2", "#A87A00", "#1F8155", "#B83A75", "#C24D1B", "#0E7C8C"]
# Texte vert natif (st.success, deltas de st.metric) : `succes` de la charte.
greenTextColor = "#1B7043"

[theme.dark]
primaryColor = "#8DB0F7"
backgroundColor = "#0F1318"
secondaryBackgroundColor = "#1E242C"
textColor = "#E8ECF2"
linkColor = "#8DB0F7"
borderColor = "#67717E"
chartCategoricalColors = ["#8DB0F7", "#E3C26B", "#8CC7A0", "#E58FB8", "#F2A07B", "#6CCAD8"]
greenTextColor = "#8CC7A0"
