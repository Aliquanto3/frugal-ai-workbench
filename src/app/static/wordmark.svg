<svg xmlns="http://www.w3.org/2000/svg" width="280" height="32" viewBox="0 0 280 32" role="img" aria-label="Frugal AI Workbench">
  <title>Frugal AI Workbench</title>
  <!-- Logotype de la charte générique v2.1 : pictogramme (tuile, trois barres, point) puis le nom, séparés de 8 px. Les couleurs sont celles de la charte (tuile, barres, point, texte) ; le thème suit prefers-color-scheme, sombre d'abord. -->
  <style>
    .t { fill: #3B6FD0 } .b { stroke: #0A1733 } .p { fill: #F0D27A } .n { fill: #E8ECF2 }
    @media (prefers-color-scheme: light) { .t { fill: #1D5BC2 } .b { stroke: #FFFFFF } .p { fill: #E0B54A } .n { fill: #121821 } }
  </style>
  <rect class="t" width="32" height="32" rx="8"/>
  <path class="b" d="M9 10h14M9 16h9M9 22h14" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle class="p" cx="23" cy="16" r="2.5"/>
  <text class="n" x="40" y="24" font-family="Sora, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">Frugal AI Workbench</text>
</svg>
